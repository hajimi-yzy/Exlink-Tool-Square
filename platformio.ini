; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = my.csv
board_upload.flash_size = 16MB
board_upload.offset_address = 0x20000
extra_scripts = pre:scripts/stamp_product.py

; OTA regression image: touch input/wake disabled; physical keys remain active.
[env:esp32s3_ota_no_touch]
extends = env:esp32s3
build_flags = -DEXLINK_TOUCH_ENABLED=0
custom_firmware_version = 1.0.2-no-touch

[env:esp32s3_ota_no_touch_v104]
extends = env:esp32s3_ota_no_touch
custom_firmware_version = 1.0.4-no-touch

; Manual power test: verified MCP4017 writes and periodic USB diagnostics.
[env:esp32s3_power_diag]
extends = env:esp32s3
build_flags = -DEXLINK_POWER_DIAGNOSTICS=1
custom_firmware_version = 1.0.5-power-diag

; UI stall isolation: same power diagnostics, without CST9220 input/polling.
[env:esp32s3_no_touch_diag]
extends = env:esp32s3_power_diag
build_flags =
    ${env:esp32s3_power_diag.build_flags}
    -DEXLINK_TOUCH_ENABLED=0
custom_firmware_version = 1.0.6-no-touch-diag

; Touch enabled: isolate all internal I2C from LVGL and the application loop.
[env:esp32s3_touch_fix]
extends = env:esp32s3_power_diag
custom_firmware_version = 1.0.7-touch-fix

; Reversible signal-integrity diagnostic. Production remains at 100 kHz.
[env:esp32s3_i2c_50k_diag]
extends = env:esp32s3
build_flags = -DEXLINK_INTERNAL_I2C_HZ=50000UL
custom_firmware_version = 1.0.23-i2c-50k
