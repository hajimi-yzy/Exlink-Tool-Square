name: Host Reliability Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host tools
        run: |
          python -m pip install ziglang==0.13.0 Pillow==11.3.0
          python - <<'PY'
          import os
          from pathlib import Path
          import ziglang
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("ZIG_EXE=" + str(Path(ziglang.__file__).with_name("zig")) + "\n")
          PY
      - name: Run host regressions
        run: python scripts/run_reliability_tests.py --output reliability-results
      - name: Upload logs and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-results
          path: reliability-results/
          if-no-files-found: error
