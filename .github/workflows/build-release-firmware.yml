name: Build And Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: esp32s3
      FLASH_MODE: dio
      FLASH_FREQ: 80m
      FLASH_SIZE: 16MB
      DIST_DIR: dist
      MERGED_BIN_NAME: exlink_usolve-esp32s3-merged.bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Firmware
        run: pio run -e "$PIO_ENV"

      - name: Package Single Firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"

          BOOT_APP0="$(find "$HOME/.platformio/packages" -path '*/framework-arduinoespressif32/tools/partitions/boot_app0.bin' | head -n 1)"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"

          if [[ -z "$BOOT_APP0" || ! -f "$BOOT_APP0" ]]; then
            echo "boot_app0.bin not found"
            exit 1
          fi

          python "$ESPTOOL" --chip esp32s3 merge_bin \
            -o "$DIST_DIR/$MERGED_BIN_NAME" \
            --flash_mode "$FLASH_MODE" \
            --flash_freq "$FLASH_FREQ" \
            --flash_size "$FLASH_SIZE" \
            0x0 ".pio/build/$PIO_ENV/bootloader.bin" \
            0x8000 ".pio/build/$PIO_ENV/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x20000 ".pio/build/$PIO_ENV/firmware.bin"

          cp ".pio/build/$PIO_ENV/firmware.bin" "$DIST_DIR/firmware.bin"
          cp ".pio/build/$PIO_ENV/bootloader.bin" "$DIST_DIR/bootloader.bin"
          cp ".pio/build/$PIO_ENV/partitions.bin" "$DIST_DIR/partitions.bin"
          sha256sum "$DIST_DIR"/* > "$DIST_DIR/SHA256SUMS.txt"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PIO_ENV }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ github.ref_name }}
          files: |
            dist/*
          generate_release_notes: true
